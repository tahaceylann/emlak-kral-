<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>Emlak Kralı</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>🏙️ Emlak Kralı</h1>
      <div id="turnInfo">Tur <span id="turnNumber">1</span></div>
    </header>

    <main id="boardWrap">
      <canvas id="boardCanvas"></canvas>
      <div id="diceDisplay" class="hidden">
        <span id="diceA">⚀</span><span id="diceB">⚀</span>
      </div>
    </main>

    <aside id="playerPanel"></aside>

    <div id="logPanel"></div>

    <footer id="controls">
      <button id="rollBtn">🎲 Zar At</button>
      <button id="restartBtn" title="Oyunu yeniden başlat">↺ Yeniden Başlat</button>
    </footer>
  </div>

  <div id="modalOverlay" class="hidden">
    <div id="buyModal" class="modal hidden">
      <h2 id="buyTileName">Mülk</h2>
      <p id="buyTileInfo"></p>
      <div class="modal-actions">
        <button id="buyYesBtn" class="primary">Satın Al</button>
        <button id="buyNoBtn">Geç</button>
      </div>
    </div>

    <div id="winModal" class="modal hidden">
      <h2 id="winTitle">Oyun Bitti</h2>
      <p id="winSubtitle"></p>
      <div class="modal-actions">
        <button id="winRestartBtn" class="primary">Yeniden Oyna</button>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="engine/board.js"></script>
  <script src="engine/dice.js"></script>
  <script src="engine/cards.js"></script>
  <script src="engine/economy.js"></script>
  <script src="engine/turns.js"></script>
  <script src="engine/pieces.js"></script>
  <script src="engine/render3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
